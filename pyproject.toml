[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisforge"
version = "0.1.0"
description = "AegisForge enterprise multi-agent AI platform foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic[email]>=2.10,<3",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.0",
  "redis>=5.0.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "python-jose[cryptography]>=3.5.0",
  "bcrypt>=4.0.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.21.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001"]  # B008: Depends() in FastAPI; BLE001: intentional safety-net exception catches

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
