name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Unit tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Frontend tests
        run: npm test

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegisforge
          POSTGRES_PASSWORD: aegisforge
          POSTGRES_DB: aegisforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: PostgreSQL + pgvector integration tests
        env:
          AEGISFORGE_INTEGRATION_TESTS: "true"
          AEGISFORGE_TEST_DATABASE_URL: postgresql+psycopg://aegisforge:aegisforge@localhost:5432/aegisforge
        run: pytest -q tests/integration/test_pgvector_integration.py tests/integration/test_postgres_approval.py
        # NOTE: Real LLM tests remain opt-in (AEGISFORGE_REAL_LLM_TESTS=true)
        # and are NOT run in CI — they require paid external LLM APIs.

  integration-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Redis integration tests
        env:
          AEGISFORGE_INTEGRATION_TESTS: "true"
          AEGISFORGE_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q tests/integration/test_redis_integration.py